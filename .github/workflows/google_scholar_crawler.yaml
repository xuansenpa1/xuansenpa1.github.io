name: Sync Google Scholar Data

on:
 workflow_dispatch:
 schedule:
  - cron: '0 8 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Generate Scholar data
      working-directory: google_scholar_crawler
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || '6IXZ2uMAAAAJ' }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python main.py
    - name: Publish generated data
      working-directory: google_scholar_crawler/results
      run: |
        git init
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add gs_data.json gs_data_shieldsio.json gs_publications.json
        git commit -m "Sync Google Scholar data"
        git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:google-scholar-stats
